# port.toml - the M5Stack Cardputer (the first one, v1.0 / v1.1 - not the ADV): its hardware, wiring and features.
#
# Read ONLY on the PC, by build_firmware.py (see ports/cardputer_adv/port.toml for how the keys become constants).
# Not yet tried on a device: the values marked CHECK come from M5Stack's documentation of the Cardputer and the
# UIFlow 2 firmware's own drivers, and have to be confirmed on the first one.
# After editing:  python3 build_firmware.py --port cardputer --gen-port-config   (then restore the default port's copy)
#
# What differs from the ADV: the keyboard is a plain key matrix on GPIOs behind a 74HC138 (no TCA8418, no interrupt);
# sound is an NS4168 amplifier and an SPM1423 microphone (no ES8311 - M5.Speaker / M5.Mic hide this); there is no
# motion sensor and no EXT header (the keyboard takes G3-G9, G11, G13, G15), so the only free pins are the Grove
# port's: a DS3231 clock goes there, and there is no place for a buzzer.

[port]
name     = "cardputer"
title    = "M5Stack Cardputer"
mcu      = "esp32s3"
firmware = "cardputer-adv-micropython"      # the same UIFlow 2 firmware recipe as the ADV ...
board    = "M5STACK_Cardputer"              # ... on its board for the first Cardputer (BOARD_ID 14: M5Unified sets up
                                            # its display, speaker and microphone)
idf      = "v5.4.2"
machine  = "Cardputer with"                 # sys.implementation._machine is "M5STACK Cardputer with ESP32-S3...":
                                            # "Cardputer with" is not part of the ADV's ("M5STACK Cardputer-ADV with ...")

[display]
driver = "m5_display"                       # the same ST7789V2 1.14" panel as the ADV
width  = 240
height = 135
fonts  = "vlw"
clock_footer = "no need to go nuts"

[i2c.grove]                                 # the Grove port (HY2.0-4P, PORT.A) - CHECK: G2 = SDA, G1 = SCL
id   = 1                                    # as on the ADV (M5.begin() may take bus 0 for itself)
sda  = 2
scl  = 1
freq = 400_000

[input]
driver   = "hc138_keypad"                   # 8 lines x 7 columns; the same key codes and key map as the ADV
keyboard = true
lines    = [8, 9, 11]                       # the 74HC138's address pins A0, A1, A2
cols     = [13, 15, 3, 4, 5, 6, 7]          # the column inputs (pull-ups; a key down reads LOW)

[buttons.quick]                             # G0: the quick recorder; held at start-up it skips the font
driver = "gpio_button"
pin    = 0

[storage]
driver    = "sd_spi"                        # the same microSD wiring as the ADV
removable = true
slot  = 3
width = 1
sck   = 40
miso  = 39
mosi  = 14
cs    = 12
freq  = 1_000_000
base_dir = "/sd/Squirrel"
flash_root = "/flash"

[clock]                                     # an optional clock module, read once at start-up - chosen in the settings
optional = true                             # (RTC_CHIP, "off" by default: no driver is loaded until one is chosen)

[clock.ds3231]                              # a DS3231 on the Grove port
driver = "ds3231"
bus    = "grove"

[power]
driver = "m5_power"                         # M5.Power: the battery through the ADC (G10)
voltage_only = true                         # charging can only be guessed (features.toml: charge_guess)

[audio_out]
driver = "m5_audio"                         # M5.Speaker (NS4168, I2S)

[audio_in]
driver = "m5_audio"                         # M5.Mic (SPM1423, PDM)

[signal.led]                                # the StampS3's WS2812 - CHECK: G21, and that it has its own supply
driver = "ws2812"
pin = 21
min_backlight = 0                           # not powered through the back-light as on the ADV
max_sum = 765                               # no current limit known: full white allowed

# [signal.buzzer]: none - no free pin for one (no EXT header; the Grove port has the clock)

[radio]
wifi = true
ble  = true                                 # the boss of the Bluetooth sync, like the ADV (it has a keyboard)

[power_mgmt]
# Light sleep ends on a key of ONE line of the matrix (hc138_keypad.py leaves it picked before a sleep: Aa, S, F, H, K,
# UP, ENTER) - without a keyboard controller the other keys cannot wake the chip.  Not G0: a wake pad is moved to the
# RTC, where its pull-up is gone - on the Cardputer ADV G0 floated, read as pressed and started the quick recorder.
wake_pins   = [13, 15, 3, 4, 5, 6, 7]
slow_cpu_hz = 80_000_000
