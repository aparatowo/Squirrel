# features.toml - the features that depend on hardware, for every port (read by build_firmware.py on the PC)
#
# A feature is built when the port has everything in `requires` (a section of port.toml, e.g. "audio_in", or a key
# that must be true, e.g. "input.keyboard") and port.toml does not switch it off in [features].  For a feature that is
# not built:  `modules` are left out of the firmware,  and the app hides  `menus` (menu ids of menu_tree.py, including
# file lists), `screens` (screen names), `actions` (menu actions), `settings` (groups of appconfig_schema.py) and
# `keys` (single settings).
# Everything not listed here works on every port.

[text_edit]                                 # typing: notes, To-Do, Mind Dump, routine names, Wi-Fi passwords
requires = ["input.keyboard"]
modules  = ["screens/note_editor_screen.py", "screens/mind_dump_screen.py"]
screens  = ["NOTE_EDITOR", "MIND_DUMP"]
menus    = ["MIND"]
settings = ["Keyboard"]
keys     = ["TODO_MAX_CHARS", "TODO_TITLE_MAX_LEN", "MIND_DUMP_MAX_CHARS"]

[notes]                                     # text notes: written and edited on the device (asked on 2026-10-10: not on the watch)
requires = ["input.keyboard"]
menus    = ["NOTES_ROOT", "NOTES", "WINS"]
keys     = ["NOTE_TITLE_MAX_LEN", "NOTE_BODY_MAX_CHARS"]

[key_calibration]
requires = ["input.keyboard"]
modules  = ["key_calibrator.py"]
screens  = ["CALIBRATOR"]

[voice_notes]
requires = ["audio_in", "storage.removable"]
modules  = ["screens/record_screen.py", "screens/playback_screen.py"]
screens  = ["RECORD", "PLAYBACK"]
menus    = ["RECORDS"]

[wifi_ntp]                                  # the clock set over Wi-Fi + NTP; saved networks
requires = ["radio.wifi"]
modules  = ["wifi_ntp.py", "time_sync.py", "wifi_profiles.py", "screens/wifi_screen.py", "screens/time_sync_screen.py"]
screens  = ["WIFI_NETWORKS", "TIME_SYNC"]
menus    = ["CONNECTIONS"]
settings = ["Network"]

[ble_sync]                                  # Bluetooth: this device can be synced by the head (docs/implementation/en/bluetooth.md)
requires = ["radio.ble"]
modules  = ["ble/peripheral.py", "ble/node_data.py", "ble/peers.py", "ble/secrets.py", "screens/ble_sync_screen.py"]
screens  = ["BLE_SYNC"]

[ble_hub]                                   # Bluetooth: this device is the head - it syncs the others (the Cardputer)
requires = ["radio.ble", "input.keyboard"]
modules  = ["ble/central.py", "screens/ble_head_screen.py"]
screens  = ["BLE_HUB"]

[hw_clock]                                  # a hardware clock to copy the time from
requires = ["clock"]
actions  = ["sync_rtc"]

[clock_module]                              # the clock is an optional module: the user says which one is plugged in
requires = ["clock.optional"]               # (RTC_CHIP; the watch's PCF8563 is part of it - nothing to choose)
keys     = ["RTC_CHIP"]

[charge_guess]                              # charging guessed from the voltage (the device cannot say it; hw/battery.py)
requires = ["power.voltage_only"]
settings = ["Experimental"]

[led]
requires = ["signal.led"]
modules  = ["screens/led_test_screen.py"]
screens  = ["LED_TESTS"]
menus    = ["LED_TEST", "LED_MODES"]
settings = ["LED"]

[deep_sleep]                                # sleeps for real; a hardware clock alarm or the button wakes it (the watch)
requires = ["clock.alarm", "power_mgmt.deep_sleep"]
modules  = ["alarms.py", "deep_sleep.py", "screens/alarms_screen.py"]
screens  = ["ALARMS"]
keys     = ["POWER_DEEP_SLEEP_MIN"]

[buzzer]
requires = ["signal.buzzer"]
menus    = ["BUZZER_TEST"]
settings = ["Buzzer"]
